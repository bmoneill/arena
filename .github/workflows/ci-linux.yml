name: Linux CI

on:
  push:
    branches: ["main", "testing"]
  pull_request:
    branches: ["main", "testing"]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache external dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/external
          key: ${{ runner.os }}-external-${{ hashFiles('external/CMakeLists.txt', 'external/raylib/CMakeLists.txt', 'external/raylib/src/CMakeLists.txt') }}

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DTEST=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ github.workspace }}/build

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{ github.workspace }}/build

      - name: Restore execute permissions to test binaries
        run: chmod -R +x ${{ github.workspace }}/build

      - name: Run tests
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --verbose

      - name: Run test coverage analysis
        id: coverage
        run: |
          raw="$(ctest --test-dir ${{github.workspace}}/build -T coverage)"
          echo "percentage=$(echo "$raw" | tail -n 1 | sed 's/.*: //' | sed 's/\..*//')" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: oneill.sh
          username: www
          key: ${{ secrets.wwwssh }}
          passphrase: ${{ secrets.wwwpass }}
          port: 22
          script: |
            sudo update-coverage arena ${{ steps.coverage.outputs.percentage }}
